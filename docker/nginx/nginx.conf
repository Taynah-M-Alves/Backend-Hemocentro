server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/hemocentro.crt;
    ssl_certificate_key /etc/nginx/certs/hemocentro.key;

    # Frontend (Vue com history mode: toda rota cai no index.html)
    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1600m;   # até 30 arquivos de 50 MB
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
